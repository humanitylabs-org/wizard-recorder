name: Thales private image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: [self-hosted, Linux, ARM64, meeting-recorder-qa]
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /home/thales.guest/meeting-ci-venv
          /home/thales.guest/meeting-ci-venv/bin/pip install -r app/requirements.txt pytest
          /home/thales.guest/meeting-ci-venv/bin/python -m pytest tests -q
      - name: Build on Thales and publish private package
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker run --privileged --rm tonistiigi/binfmt --install amd64
          docker buildx create --name meeting-recorder-qa --driver docker-container --use || docker buildx use meeting-recorder-qa
          docker buildx build --platform linux/arm64,linux/amd64 --provenance=false --push -f app/Dockerfile --label org.opencontainers.image.revision="$GITHUB_SHA" -t ghcr.io/humanitylabs-org/meeting-recorder:0.1.0 -t ghcr.io/humanitylabs-org/meeting-recorder:"$GITHUB_SHA" .
          docker buildx imagetools inspect ghcr.io/humanitylabs-org/meeting-recorder:0.1.0
