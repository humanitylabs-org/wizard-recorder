name: Mizel regression contracts
on:
  pull_request:
    paths:
      - 'adoptions/mizel-live/**'
      - 'tools/check-deployment-lineage.py'
      - 'tests/test_deployment_lineage.py'
      - '.github/workflows/mizel-contracts.yml'
  push:
    branches: [feature/agent-binding]
    paths:
      - 'adoptions/mizel-live/**'
      - 'tools/check-deployment-lineage.py'
      - 'tests/test_deployment_lineage.py'
      - '.github/workflows/mizel-contracts.yml'
permissions:
  contents: read
jobs:
  focused-contracts:
    # Lightweight JS/source checks only. Browser, emulator and builds stay on Thales.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source-preservation gate
        run: python3 -m unittest discover -s tests -p test_deployment_lineage.py -v
      - name: Test adopted live-app contracts
        working-directory: adoptions/mizel-live
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
