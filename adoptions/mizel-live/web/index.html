<!doctype html>
<html lang="en" data-app="mizel">
<head>
  <script src="/wizard-os-home/core/app-capture.js"></script>
  <script src="/wizard-os-home/core/app-client.js"></script>
  <meta charset="utf-8">
  <title>Recorder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f1014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mizel">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="referrer" content="same-origin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="wizard-style.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="wizard-appearance.css">
  
  </head>
<body>
  <svg hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11.5" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7" y="5.5" width="3.4" height="13" rx="1.2" fill="currentColor"/><rect x="13.6" y="5.5" width="3.4" height="13" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2a.8.8 0 0 0-1.2.7z" fill="currentColor"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2.4" fill="currentColor"/></symbol>
    <symbol id="i-transcript" viewBox="0 0 24 24"><path d="M4.5 6.5h15M4.5 11h15M4.5 15.5h9M4.5 20h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.6" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M5 19.5c1.3-3.2 4-4.8 7-4.8s5.7 1.6 7 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-off" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M6.5 17.5l11-11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M15.6 15.6L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12.5" rx="2.2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8.5 20.5h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5l1.7 5.1a2.5 2.5 0 0 0 1.6 1.6l5.2 1.8-5.2 1.8a2.5 2.5 0 0 0-1.6 1.6L12 20.5l-1.7-5.1a2.5 2.5 0 0 0-1.6-1.6L3.5 12l5.2-1.8a2.5 2.5 0 0 0 1.6-1.6z" fill="currentColor"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5" stroke="currentColor" stroke-width="1.8" fill="none"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v2M6.5 7l.9 12a1.8 1.8 0 0 0 1.8 1.6h5.6a1.8 1.8 0 0 0 1.8-1.6l.9-12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M8 14h8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-mark" viewBox="0 0 32 32"><rect x="5" y="12.5" width="3" height="7" rx="1.5" fill="currentColor" opacity=".55"/><rect x="10.5" y="8" width="3" height="16" rx="1.5" fill="currentColor"/><rect x="16" y="5" width="3" height="22" rx="1.5" fill="currentColor"/><rect x="21.5" y="10" width="3" height="12" rx="1.5" fill="currentColor" opacity=".8"/><rect x="27" y="14" width="2.5" height="4" rx="1.25" fill="currentColor" opacity=".45"/></symbol>
  </svg>

  <div id="app" class="app" data-view="home">
    <!-- ───────── Sidebar / mobile home ───────── -->
    <aside class="side" id="list-pane" aria-label="Meetings">
      <header class="side-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#i-mark"/></svg></span>
          <span class="brand-text"><b>Recorder</b></span>
        </div>
      </header>
      <!-- New recording: floating bottom-right on phones (thumb reach), as in native Mizel.ai. Keep it there. -->
      <button id="btn-new-mobile" class="rec-fab only-mobile" type="button" aria-label="New recording"><svg class="w-ic" aria-hidden="true"><use href="#i-mic"/></svg></button>
      <div class="side-actions">
        <button id="search-open" class="w-field search-trigger" type="button" aria-label="Search meetings and actions">
          <svg class="w-ic" aria-hidden="true"><use href="#i-search"/></svg><span>Search</span><kbd class="w-kbd only-desktop" data-mod>⌘K</kbd>
        </button>
        <button id="btn-new" class="w-btn w-btn-primary new-btn only-desktop" type="button">
          <svg class="w-ic" aria-hidden="true"><use href="#i-mic"/></svg>Record
        </button>
      </div>
      <div id="rec-banner" class="rec-banner" hidden></div>
      <div class="side-scroll" id="list-scroll">
        <section id="upcoming" class="upcoming" aria-label="Coming up"></section>
        <section id="meetings" class="meetings" aria-label="Past meetings"></section>
      </div>
      <footer class="side-foot" id="list-foot">
        <label class="toggle-row" id="sys-audio-row" hidden>
          <svg class="w-ic" aria-hidden="true"><use href="#i-screen"/></svg>
          <span>Record computer audio</span>
          <span class="w-switch"><input type="checkbox" id="sys-audio" aria-label="Record computer audio too"><i></i></span>
        </label>
        <button id="btn-keys" class="w-icon-btn only-desktop" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"><svg class="w-ic"><use href="#i-keyboard"/></svg></button>
      </footer>
    </aside>

    <!-- ───────── Main ───────── -->
    <main class="main" id="doc-pane">
      <header class="topbar" id="topbar">
        <button id="btn-back" class="w-icon-btn back" type="button" aria-label="Back to meetings"><svg class="w-ic"><use href="#i-back"/></svg></button>
        <div id="top-status" class="top-status"></div>
        <span class="spacer"></span>
        <span id="saved" class="saved off" aria-live="polite"></span>
        <div class="doc-actions" id="doc-actions"></div>
      </header>

      <div class="doc-scroll" id="doc-scroll">
        <section id="home-panel" class="home">
          <div class="home-inner w-enter">
            <p id="home-date" class="eyebrow" hidden></p>
            <h2 id="greeting" class="greeting" hidden>Good day</h2>
            <p id="home-stats" class="home-stats" hidden></p>
            <div id="next-up" class="next-up"></div>
            <div class="ask-home" hidden>
              <div class="ask-home-head"><svg class="w-ic" aria-hidden="true"><use href="#i-spark"/></svg>Ask across your meetings</div>
              <div id="ask-all-mount"></div>
              <div id="ask-suggest" class="ask-suggest"></div>
            </div>
          </div>
        </section>

        <article id="doc" class="doc" hidden>
          <header class="doc-head">
            <p id="eyebrow" class="eyebrow"></p>
            <h1 id="title" class="title" spellcheck="false" aria-label="Meeting title"></h1>
            <div id="meta" class="meta"></div>
          </header>
          <div id="doc-route" class="doc-route" hidden></div>
          <div id="doc-status" class="doc-status"></div>
          <div id="doc-toolbar" class="doc-toolbar"></div>
          <div id="live-connection" class="live-connection" hidden role="status"></div>
          <div id="doc-body" class="doc-body">
            <div id="conflict" class="conflict" hidden></div>
            <textarea id="notepad" class="notepad" rows="1" placeholder="Write as little as you like. Mizel listens, and fills in the rest when you stop." aria-label="Your notes"></textarea>
            <div id="notes-actions" class="notes-actions" hidden></div>
            <div id="notes-view" class="notes-view" hidden></div>
            <div id="enhanced" class="enhanced" hidden></div>
            <section id="transcript-inline" class="transcript-inline" hidden aria-label="Transcript">
              <div class="transcript-status"><span id="drawer-count"></span><span id="drawer-pending"></span></div>
              <div id="segments" class="segments"></div>
              <details id="original-live-summary" class="original-summary" hidden>
                <summary>Original live summary</summary>
                <div id="original-summary-body" class="summary"></div>
              </details>
            </section>
            <section id="summary" class="summary inline-summary" hidden aria-label="Live summary" aria-live="polite"></section>
          </div>
          <section id="arch-section" class="arch-section" hidden aria-label="Asked Archimedes"></section>
          <section id="asks" class="asks" aria-label="Questions about this meeting"></section>
        </article>
        <section id="arch-view" class="doc arch-view" hidden aria-label="Archimedes answers"></section>
      </div>

      <form id="ask-meeting" class="composer" hidden autocomplete="off">
        <div class="composer-box">
          <svg class="w-ic spark" aria-hidden="true"><use href="#i-spark"/></svg>
          <input id="ask-meeting-input" type="text" placeholder="Ask about this meeting" aria-label="Ask about this meeting" enterkeyhint="send">
          <button class="send" type="submit" aria-label="Ask"><svg class="w-ic"><use href="#i-send"/></svg></button>
        </div>
      </form>

      <section id="live" class="live" hidden aria-live="polite" aria-label="Live mode"></section>
      <div id="pill" class="recorder" hidden role="region" aria-label="Recorder"></div>
    </main>

    <!-- Ask across meetings: lives on the desktop home, or at the foot of the mobile list -->
    <section id="ask-all" class="askall" hidden aria-label="Ask across all meetings">
      <div id="ask-all-thread" class="askall-thread"></div>
      <form id="ask-all-form" class="composer inline" autocomplete="off">
        <div class="composer-box">
          <svg class="w-ic spark" aria-hidden="true"><use href="#i-spark"/></svg>
          <input id="ask-all-input" type="text" placeholder="Ask across all meetings" aria-label="Ask across all meetings" enterkeyhint="send">
          <button class="send" type="submit" aria-label="Ask"><svg class="w-ic"><use href="#i-send"/></svg></button>
        </div>
      </form>
    </section>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="tip" class="cite-tip" hidden role="tooltip"></div>
    <div id="overlay-root"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
