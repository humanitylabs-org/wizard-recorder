services:
  mizel:
    image: ghcr.io/humanitylabs-org/meeting-recorder:0.2.0
    user: 1000:1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    tmpfs: [/tmp]
    environment:
      MEETINGS_DATA: /data
      TRANSCRIPTION_URL: ${TRANSCRIPTION_URL}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL}
      MEETINGS_ALLOWED_ORIGINS: ${MEETINGS_ALLOWED_ORIGINS:-}
      MEETINGS_ALLOWED_HOSTS: ${MEETINGS_ALLOWED_HOSTS:-}
      MEETINGS_TIMEZONE: ${MEETINGS_TIMEZONE:-UTC}
      MEETINGS_LLM_URL: ${MEETINGS_LLM_URL:-}
      MEETINGS_LLM_MODEL: ${MEETINGS_LLM_MODEL:-}
      MEETINGS_LLM_KEY: ${MEETINGS_LLM_KEY:-}
      WIZARD_DELIVERY_URL: ${WIZARD_DELIVERY_URL:-}
      WIZARD_DELIVERY_TOKEN: ${WIZARD_DELIVERY_TOKEN:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
  overrides: []
