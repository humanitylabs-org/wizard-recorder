<!doctype html>
<html lang="en" data-app="meeting-recorder">
<head>
  <meta charset="utf-8">
  <title>Meeting Recorder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark light">
  <script src="boot.js"></script>
  <script src="theme-client.js"></script>
  <meta name="theme-color" content="#171614">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meetings">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="referrer" content="same-origin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="wizard-ui.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="appearance.css">
</head>
<body>
  <svg hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-transcript" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18" cy="12" r="1.8" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 21h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <div id="app" class="app" data-view="home">
    <!-- ───────── List pane / Home ───────── -->
    <aside class="pane list-pane" id="list-pane" aria-label="Meetings">
      <header class="list-head">
        <h1 class="brand">Meetings</h1>
        <button id="btn-new" class="btn primary" type="button">
          <svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg>New meeting
        </button>
      </header>
      <button id="btn-upload" class="btn ghost" type="button">Upload audio</button><input id="upload-audio" type="file" accept="audio/*" hidden>
      <div id="rec-banner" class="rec-banner" hidden></div>
      <label class="search" for="search">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Search meetings" autocomplete="off" aria-label="Search meetings">
      </label>
      <div class="list-scroll" id="list-scroll">
        <section id="upcoming" class="upcoming" aria-label="Coming up"></section>
        <section id="meetings" class="meetings" aria-label="Past meetings"></section>
      </div>
      <footer class="list-foot" id="list-foot">
        <label class="check" id="sys-audio-row" hidden>
          <input type="checkbox" id="sys-audio"> Include computer audio when recording
        </label>
      </footer>
    </aside>

    <!-- ───────── Document pane ───────── -->
    <main class="pane doc-pane" id="doc-pane">
      <div class="doc-scroll" id="doc-scroll">
        <section id="home-panel" class="home-panel">
          <div class="home-intro">
            <h2 id="greeting">Good day</h2>
            <p class="muted">Start a meeting or upload audio. Recordings and notes stay in this app’s private data volume.</p>
          </div>
          <div id="ask-all-mount"></div>
        </section>

        <article id="doc" class="doc" hidden>
          <header class="doc-head">
            <button id="btn-back" class="icon-btn back" type="button" aria-label="Back to meetings">
              <svg class="ic" aria-hidden="true"><use href="#i-back"/></svg>
            </button>
            <div class="doc-head-main">
              <h1 id="title" class="title" spellcheck="false" aria-label="Meeting title"></h1>
              <div id="meta" class="meta"></div>
            </div>
            <div class="doc-actions" id="doc-actions"></div>
          </header>
          <div id="doc-status" class="doc-status"></div>
          <div id="doc-toolbar" class="doc-toolbar"></div>
          <div id="doc-body" class="doc-body">
            <div id="conflict" class="conflict" hidden></div>
            <textarea id="notepad" class="notepad" rows="1" placeholder="Jot a few notes. Wizard fills in the rest when you stop." aria-label="Your notes"></textarea>
            <div id="enhanced" class="enhanced" hidden></div>
            <section id="transcript-inline" class="transcript-inline" hidden></section>
          </div>
          <section id="asks" class="asks" aria-label="Questions about this meeting"></section>
        </article>
      </div>

      <form id="ask-meeting" class="askbar" hidden autocomplete="off">
        <input id="ask-meeting-input" type="text" placeholder="Ask anything about this meeting" aria-label="Ask about this meeting" enterkeyhint="send">
        <button class="icon-btn send" type="submit" aria-label="Ask"><svg class="ic" aria-hidden="true"><use href="#i-send"/></svg></button>
      </form>

      <div id="drawer" class="drawer" hidden aria-label="Live transcript">
        <header class="drawer-head">
          <span class="drawer-title">Transcript <span id="drawer-count" class="count"></span></span>
          <span id="drawer-pending" class="muted small"></span>
          <button id="drawer-close" class="icon-btn" type="button" aria-label="Close transcript"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
        </header>
        <div id="segments" class="segments"></div>
      </div>

      <div id="pill" class="pill" hidden role="status"></div>
    </main>

    <!-- Global "ask across meetings" widget; moved between panes by layout -->
    <section id="ask-all" class="askall" aria-label="Ask across all meetings">
      <div id="ask-all-thread" class="askall-thread"></div>
      <form id="ask-all-form" class="askbar inset" autocomplete="off">
        <input id="ask-all-input" type="text" placeholder="Ask across all meetings" aria-label="Ask across all meetings" enterkeyhint="send">
        <button class="icon-btn send" type="submit" aria-label="Ask"><svg class="ic" aria-hidden="true"><use href="#i-send"/></svg></button>
      </form>
    </section>

    <div id="toasts" class="toasts" aria-live="polite"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
